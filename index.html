<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b3d1e">
<title>Sofia's Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:#fdfdf5;
    background:linear-gradient(180deg,#1e90e8 0%,#5ec2ff 34%,#8fd14f 78%,#43a912 100%);
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);
    display:flex;flex-direction:column;align-items:center;
  }
  .sun{position:fixed;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,#fff6be 0%,#ffd54a 45%,rgba(255,213,74,0) 72%);pointer-events:none}
  header{text-align:center;z-index:1}
  .critters{font-size:40px;letter-spacing:6px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
  h1{
    font-family:'Baloo 2',cursive;font-size:min(15vw,64px);font-weight:800;line-height:1.02;margin-top:6px;
    background:linear-gradient(180deg,#f4ffb8 10%,#a5e82e 50%,#38b000 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(10,40,16,.5)) drop-shadow(0 12px 24px rgba(0,0,0,.3));
  }
  .subtitle{font-family:'Baloo 2',cursive;font-size:19px;font-weight:700;color:#fff;margin-top:6px;
    text-shadow:0 2px 10px rgba(10,50,20,.45)}
  main{width:100%;max-width:460px;margin-top:30px;display:flex;flex-direction:column;gap:16px;z-index:1}
  .card{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:#fdfdf5;
    background:rgba(8,32,15,.55);border:1px solid rgba(255,255,255,.18);border-radius:22px;
    padding:18px;backdrop-filter:blur(6px);box-shadow:0 14px 34px rgba(0,0,0,.3);
    transition:transform .1s ease;
  }
  .card:active{transform:scale(.97)}
  .card .art{font-size:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
  .card .name{font-family:'Baloo 2',cursive;font-size:27px;font-weight:800;line-height:1.05}
  .card .tag{font-size:14.5px;font-weight:700;opacity:.88;margin-top:2px}
  .card .go{
    margin-left:auto;flex:none;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#173d10;
    background:linear-gradient(180deg,#cff74a,#76d113);border-radius:99px;padding:10px 20px;
    box-shadow:0 5px 0 #4c8a12, 0 10px 20px rgba(0,0,0,.3);
  }
  .card.soon{border-style:dashed;background:rgba(8,32,15,.32);box-shadow:none}
  .card.soon .art{font-size:40px}
  .card.soon .name{font-size:21px;opacity:.92}
  footer{margin-top:34px;font-size:14.5px;font-weight:700;color:rgba(255,255,255,.9);
    text-shadow:0 2px 8px rgba(10,50,20,.4);z-index:1}
</style>
</head>
<body>
<div class="sun"></div>
<header>
  <div class="critters">🐛 🦋</div>
  <h1>Sofia's Arcade</h1>
  <div class="subtitle">Games made for Sofia, with love</div>
</header>
<main>
  <a class="card" href="gusano/">
    <div class="art">🐛</div>
    <div>
      <div class="name">Gusano</div>
      <div class="tag">From a little worm… to a butterfly! 🦋</div>
    </div>
    <div class="go">Play</div>
  </a>
  <a class="card" href="ariana/">
    <div class="art">🧙</div>
    <div>
      <div class="name">Ariana Rescue</div>
      <div class="tag">Climb the Wizard's tower and save Ariana! 🦋</div>
    </div>
    <div class="go">Play</div>
  </a>
  <div class="card soon">
    <div class="art">✨</div>
    <div>
      <div class="name">More games coming soon…</div>
      <div class="tag">This shelf is just getting started</div>
    </div>
  </div>
</main>
<footer>For Sofia — from Dad 💚</footer>
</body>
</html>
